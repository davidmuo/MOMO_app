<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoMo Dashboard</title>
  <link rel="icon" type="image/png" href="/static/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
  <link rel="stylesheet" href="/static/styles.css" />
  <script defer src="/static/script.js"></script>
</head>
<body>

  <!-- ── Icon Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="/static/logo.png" alt="MoMo" />
    </div>
    <nav class="sidebar-nav">
      <a href="#overview"          class="nav-icon active" data-tip="Overview"><i class="fas fa-gauge-high"></i></a>
      <a href="#trends"            class="nav-icon"        data-tip="Trends"><i class="fas fa-chart-line"></i></a>
      <a href="#activity"          class="nav-icon"        data-tip="Activity"><i class="fas fa-fire"></i></a>
      <a href="#all-transactions"  class="nav-icon"        data-tip="All Data"><i class="fas fa-table-list"></i></a>
    </nav>
    <div class="sidebar-foot">
      <button class="theme-icon active" id="light-mode-btn" title="Light"><i class="fas fa-sun"></i></button>
      <button class="theme-icon"        id="dark-mode-btn"  title="Dark"><i class="fas fa-moon"></i></button>
    </div>
  </aside>

  <!-- ── App wrapper ── -->
  <div class="app">

    <!-- Main column -->
    <div class="main-col">

      <!-- Topbar -->
      <header class="topbar">
        <h1 class="page-title">Dashboard</h1>
        <div class="topbar-mid">
          <div class="search-bar">
            <i class="fas fa-magnifying-glass"></i>
            <input id="global-search" type="text" placeholder="Search transactions…" />
          </div>
        </div>
        <div class="topbar-end">
          <button class="icon-btn" id="export-csv" title="Export CSV"><i class="fas fa-download"></i></button>
          <div class="avatar">DM</div>
        </div>
      </header>

      <!-- Scrollable content -->
      <div class="content">

        <!-- Filters -->
        <div class="filter-row">
          <i class="fas fa-sliders"></i>
          <input type="date" id="from-date" />
          <span class="sep">→</span>
          <input type="date" id="to-date" />
          <select id="transaction-type">
            <option value="All">All Types</option>
            <option value="Bank Deposit">Bank Deposit</option>
            <option value="Withdrawal from Agent">Withdrawal</option>
            <option value="Transfer To Mobile Number">Transfer</option>
            <option value="Cash Power">Cash Power</option>
            <option value="Airtime Bill">Airtime Bill</option>
            <option value="Payment to Code">Payment to Code</option>
            <option value="Incoming Money">Incoming Money</option>
            <option value="Internet and Voice Bundle">Bundle</option>
            <option value="OTP Message">OTP Message</option>
          </select>
          <button id="apply-filters" class="btn-apply">Apply</button>
          <button id="clear-filters" class="btn-clear">Clear</button>
        </div>

        <!-- Stat cards -->
        <section class="stats-grid" id="overview">
          <div class="stat-card stat-card--yellow">
            <div class="sc-icon"><i class="fas fa-receipt"></i></div>
            <div class="sc-body">
              <p class="sc-label">Total Transactions</p>
              <h2 class="sc-value" id="stat-total-tx">—</h2>
              <p class="sc-trend" id="trend-tx"></p>
            </div>
          </div>
          <div class="stat-card">
            <div class="sc-icon" style="background:#F0FDF4;color:#16A34A;"><i class="fas fa-coins"></i></div>
            <div class="sc-body">
              <p class="sc-label">Total Volume</p>
              <h2 class="sc-value" id="stat-total-amount">—</h2>
              <p class="sc-trend" id="trend-amount"></p>
            </div>
          </div>
          <div class="stat-card">
            <div class="sc-icon" style="background:#F5F3FF;color:#7C3AED;"><i class="fas fa-hand-holding-dollar"></i></div>
            <div class="sc-body">
              <p class="sc-label">Total Fees Paid</p>
              <h2 class="sc-value" id="stat-total-fees">—</h2>
              <p class="sc-trend" id="trend-fees"></p>
            </div>
          </div>
          <div class="stat-card">
            <div class="sc-icon" style="background:#EFF6FF;color:#2563EB;"><i class="fas fa-star"></i></div>
            <div class="sc-body">
              <p class="sc-label">Top Type</p>
              <h2 class="sc-value sc-value--sm" id="stat-top-type">—</h2>
            </div>
          </div>
        </section>

        <!-- Charts -->
        <section class="charts-row" id="trends">
          <div class="card">
            <div class="card-header">
              <h3>Monthly Trends</h3>
              <div class="pill-tabs" id="trend-tabs">
                <button class="pill active" data-metric="amounts">Volume</button>
                <button class="pill" data-metric="counts">Count</button>
                <button class="pill" data-metric="fees">Fees</button>
              </div>
            </div>
            <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
          </div>
          <div class="card">
            <div class="card-header">
              <h3>Transaction Types</h3>
              <div class="pill-tabs" id="type-tabs">
                <button class="pill active" data-type="doughnut">Ring</button>
                <button class="pill" data-type="bar">Bar</button>
              </div>
            </div>
            <div class="chart-wrap chart-wrap--donut"><canvas id="typeChart"></canvas></div>
          </div>
        </section>

        <!-- Heatmap -->
        <div class="card" id="activity">
          <div class="card-header">
            <h3>Transaction Activity</h3>
            <div class="heatmap-legend">
              <span>Less</span>
              <div class="lc" style="background:#EAECF2;"></div>
              <div class="lc" style="background:#FFF0A0;"></div>
              <div class="lc" style="background:#F9CA24;"></div>
              <div class="lc" style="background:#E1A800;"></div>
              <div class="lc" style="background:#B8860B;"></div>
              <span>More</span>
            </div>
          </div>
          <div class="heatmap-months" id="heatmap-months"></div>
          <div class="heatmap-body">
            <div class="heatmap-days">
              <span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span>Sun</span>
            </div>
            <div class="heatmap-grid" id="heatmap-grid"></div>
          </div>
          <div class="heatmap-tooltip" id="heatmap-tooltip"></div>
        </div>

        <!-- All Transactions -->
        <div class="card" id="all-transactions">
          <div class="card-header">
            <h3>All Transactions</h3>
            <span class="record-count" id="record-count"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr>
                <th>Tx ID</th><th>Date</th><th>Type</th><th>Amount</th><th>Fee</th>
              </tr></thead>
              <tbody id="transaction-table-body">
                <tr><td colspan="5" class="empty-cell"><i class="fas fa-spinner fa-spin"></i> Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div><!-- /.content -->
    </div><!-- /.main-col -->

    <!-- Right panel -->
    <aside class="right-panel">
      <div class="rp-head">
        <h3>Recent Transactions</h3>
        <button class="icon-btn-sm" id="rp-refresh" title="Refresh"><i class="fas fa-rotate"></i></button>
      </div>
      <div class="rp-body" id="rp-body">
        <div class="empty-cell"><i class="fas fa-spinner fa-spin"></i> Loading…</div>
      </div>
    </aside>

  </div><!-- /.app -->

</body>
</html>
